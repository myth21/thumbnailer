version: '3.5'
services:
    web:
        image: cr.userstory.ru/docker/us-nginx/nginx-standart:latest
        container_name: thumbnailer-web
        volumes:
            - "./conf/nginx/thumbnailer.conf:/etc/nginx/conf.d/thumbnailer.conf:rw"
            - "./../_logs/nginx/:/var/log/nginx/"
            - "./../:/data"
        ports:
            - "10.222.33.1:80:80"
        restart: always
        depends_on:
            - fpm
            - db
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.2

    fpm:
        container_name: thumbnailer-fpm
        image: thumbnailer-php-fpm:local
        build: ./dockerfiles/php-fpm
        restart: always
        volumes:
            - "./conf/php/ext-cfg.ini:/usr/local/etc/php/conf.d/ext-cfg.ini"
            - "./conf/php/php.ini:/usr/local/etc/php/php.ini"
            - "./../:/data"
            - "/home/dev/projects/original-images-example:/data/upload" # TODO for each new project
        env_file:
            - ./../.env.develop
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.3

    php-worker:
        container_name: thumbnailer-worker
        image: thumbnailer-php-cli:local
        build: ./dockerfiles/php-cli
        restart: always
        volumes:
            - "./conf/php/ext-cfg.ini:/usr/local/etc/php/conf.d/ext-cfg.ini"
            - "./conf/php/php.ini:/usr/local/etc/php/php.ini"
            - "./../:/data"
        env_file:
            - "./../.env.develop"
        depends_on:
            - fpm
            - rabbit
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.8

    php-worker2:
        container_name: thumbnailer-worker2
        image: thumbnailer-php-cli:local
        build: ./dockerfiles/php-cli
        restart: always
        volumes:
            - "./conf/php/ext-cfg.ini:/usr/local/etc/php/conf.d/ext-cfg.ini"
            - "./conf/php/php.ini:/usr/local/etc/php/php.ini"
            - "./../:/data"
        env_file:
            - "./../.env.develop"
        depends_on:
            - fpm
            - rabbit
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.9

    php-worker3:
        container_name: thumbnailer-worker3
        image: thumbnailer-php-cli:local
        build: ./dockerfiles/php-cli
        restart: always
        volumes:
            - "./conf/php/ext-cfg.ini:/usr/local/etc/php/conf.d/ext-cfg.ini"
            - "./conf/php/php.ini:/usr/local/etc/php/php.ini"
            - "./../:/data"
        env_file:
            - "./../.env.develop"
        depends_on:
            - fpm
            - rabbit
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.10

    db:
        image: cr.userstory.ru/docker/postgresql-alpine/14.2:latest
        container_name: thumbnailer-db
        restart: always
        environment:
            - POSTGRES_DB=thumbnailer
            - POSTGRES_PASSWORD=123
        volumes:
            - "./conf/postgres/:/docker-entrypoint-initdb.d/"
            - "./../_db:/var/lib/postgresql/data:rw"
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.4

    rabbit:
        container_name: thumbnailer-rabbit
        image: rabbitmq:3.10.2-management-alpine
        restart: always
        volumes:
            - "./conf/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf"
            - "./conf/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json"
            - "./../_rabbit:/var/lib/rabbitmq"
        ports:
            - "10.222.33.1:5672:5672"
            - "10.222.33.1:15672:15672"
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.5

    pgadmin:
        container_name: thumbnailer-pgadmin
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.6

    php-composer:
        image: cr.userstory.ru/docker/php-composer2-alpine/php8.1:latest
        container_name: thumbnailer-composer
        working_dir: /data
        command: composer install
        volumes:
            - "./conf/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
            - "./../:/data"
        networks:
            networks_thumbnailer:
                ipv4_address: 10.222.33.7

networks:
    networks_thumbnailer:
        ipam:
            driver: default
            config:
                - subnet: 10.222.33.0/24
